<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="270" rx="24" fill="#1B1D1F"/>
  <rect x="1" y="1" width="1198" height="268" rx="23" stroke="#3A3D41" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(48 58)">
      <rect width="220" height="152" rx="18" fill="#242629" stroke="#404348"/>
      <text x="22" y="35" fill="#69D8BE" font-size="13" font-weight="700">01 · ASK</text>
      <text x="22" y="76" fill="#F0F1F2" font-size="18" font-weight="700">Describe the task</text>
      <text x="22" y="107" fill="#9FA4A9" font-size="14">Add files, images</text>
      <text x="22" y="130" fill="#9FA4A9" font-size="14">or workspace context.</text>
    </g>
    <path d="M280 134H310" stroke="#555A60" stroke-width="2"/><path d="M301 125L310 134L301 143" stroke="#69D8BE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(322 58)">
      <rect width="220" height="152" rx="18" fill="#242629" stroke="#404348"/>
      <text x="22" y="35" fill="#69D8BE" font-size="13" font-weight="700">02 · WORK</text>
      <text x="22" y="76" fill="#F0F1F2" font-size="18" font-weight="700">Agent takes action</text>
      <text x="22" y="107" fill="#9FA4A9" font-size="14">Reads, edits and runs</text>
      <text x="22" y="130" fill="#9FA4A9" font-size="14">inside your policy.</text>
    </g>
    <path d="M554 134H584" stroke="#555A60" stroke-width="2"/><path d="M575 125L584 134L575 143" stroke="#69D8BE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
