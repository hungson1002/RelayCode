      <text x="22" y="35" fill="#69D8BE" font-size="13" font-weight="700">03 · REVIEW</text>
      <text x="22" y="76" fill="#F0F1F2" font-size="18" font-weight="700">Inspect every change</text>
      <text x="22" y="107" fill="#9FA4A9" font-size="14">See files, hunks,</text>
      <text x="22" y="130" fill="#9FA4A9" font-size="14">commands and output.</text>
